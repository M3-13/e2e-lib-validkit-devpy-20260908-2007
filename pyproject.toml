[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "Kleine Python-Bibliothek mit Prüf- und Normalisierungsfunktionen"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0,<9.0"]

[tool.setuptools.packages.find]
include = ["validkit*"]
